services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_dev
    ports:
      # Host 5437 — this machine runs several other local Postgres containers
      # (5432-5436 already taken by unrelated projects); this avoids colliding
      # with any of them.
      - '5437:5432'
    volumes:
      # Postgres 18+'s official image expects the volume at /var/lib/postgresql
      # (not .../data) — see https://github.com/docker-library/postgres/pull/1259.
      - fashnlink_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d app_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6389:6379'
    volumes:
      - fashnlink_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-http:
    # @upstash/redis only speaks Upstash's HTTP REST API, not the raw Redis
    # protocol; this proxy (tested nightly against @upstash/redis upstream)
    # fronts the plain `redis` service above with that same REST contract, so
    # the app's one Redis client works unchanged in dev and prod.
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    ports:
      - '8079:80'
    environment:
      SRH_MODE: env
      SRH_TOKEN: dev-local-redis-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  fashnlink_postgres_data:
  fashnlink_redis_data:
